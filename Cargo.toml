[workspace]
resolver = "2"
members = [
    "crates/ws-core",
    "crates/ws-domain",
    "crates/ws-solvers",
    "crates/ws-engine",
    "crates/ws-server",
    "worldsim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["WorldSim contributors"]
repository = "https://github.com/hyqzz/worldsim"
homepage = "https://github.com/hyqzz/worldsim"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
