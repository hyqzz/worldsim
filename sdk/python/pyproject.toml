[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim"
version = "0.1.0"
description = "WorldSim — physics-world simulation infrastructure (Python SDK)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "WorldSim contributors" }]
keywords = ["physics", "simulation", "sph", "digital-twin", "worldsim"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/hyqzz/worldsim"
Repository = "https://github.com/hyqzz/worldsim"
Documentation = "https://github.com/hyqzz/worldsim#readme"
Issues = "https://github.com/hyqzz/worldsim/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["worldsim*"]
